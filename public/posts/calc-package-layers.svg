<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1f2a33; }
    .t { font-size: 20px; font-weight: bold; }
    .s { font-size: 13px; font-style: italic; fill: #6b7680; }
    .h { font-size: 13px; font-weight: bold; }
    .l { font-size: 12px; }
    .m { font-size: 11px; fill: #6b7680; }
    .mi { font-size: 11px; fill: #6b7680; font-style: italic; }
    .col { font-size: 11px; font-weight: bold; fill: #6b7680; letter-spacing: 1px; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C49A2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="520" rx="10" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="6" rx="3" fill="#C49A2E"/>

  <text class="t" x="40" y="40">What Is Actually in a Calc Package</text>
  <text class="s" x="40" y="60">Five layers. The value climbs toward the top. So does the part that is not yours to sell.</text>

  <!-- column headers -->
  <text class="col" x="60" y="100">LAYER</text>
  <text class="col" x="370" y="100">WHO OWNS IT</text>
  <text class="col" x="575" y="100">WHAT A MODEL LEARNS</text>
  <line x1="40" y1="108" x2="760" y2="108" stroke="#e3e6e9" stroke-width="1"/>

  <!-- layers, top = most valuable. each row 62 tall starting y=120 -->
  <!-- row 5: review markups -->
  <rect x="60" y="120" width="290" height="54" rx="4" fill="#b03a2e" opacity="0.14"/>
  <rect x="60" y="120" width="6" height="54" fill="#b03a2e"/>
  <text class="h" x="76" y="142">Review markups and corrections</text>
  <text class="mi" x="76" y="160">what got crossed out, and why</text>
  <text class="l" x="370" y="151">firm and client</text>
  <text class="l" x="575" y="145">judgement under pressure:</text>
  <text class="l" x="575" y="160">the fifteen-year layer</text>

  <!-- row 4: judgement notes -->
  <rect x="60" y="182" width="290" height="54" rx="4" fill="#b03a2e" opacity="0.09"/>
  <rect x="60" y="182" width="6" height="54" fill="#b03a2e" opacity="0.7"/>
  <text class="h" x="76" y="204">Design notes and assumptions</text>
  <text class="mi" x="76" y="222">why 0.35 not 0.7, which case was dismissed</text>
  <text class="l" x="370" y="213">firm and client</text>
  <text class="l" x="575" y="207">how decisions are framed,</text>
  <text class="l" x="575" y="222">not just what they were</text>

  <!-- row 3: analysis model -->
  <rect x="60" y="244" width="290" height="54" rx="4" fill="#C49A2E" opacity="0.12"/>
  <rect x="60" y="244" width="6" height="54" fill="#C49A2E"/>
  <text class="h" x="76" y="266">Analysis model and modifiers</text>
  <text class="mi" x="76" y="284">the ETABS file, the mesh, the stiffness choices</text>
  <text class="l" x="370" y="275">firm, under NDA</text>
  <text class="l" x="575" y="269">how a real building is</text>
  <text class="l" x="575" y="284">idealised by a competent engineer</text>

  <!-- row 2: drawings and specs -->
  <rect x="60" y="306" width="290" height="54" rx="4" fill="#6b7680" opacity="0.10"/>
  <rect x="60" y="306" width="6" height="54" fill="#6b7680"/>
  <text class="h" x="76" y="328">Drawings, specs, submittals</text>
  <text class="mi" x="76" y="346">the deliverables</text>
  <text class="l" x="370" y="337">client, by assignment</text>
  <text class="l" x="575" y="331">how intent becomes a document</text>
  <text class="l" x="575" y="346">that a builder can price</text>

  <!-- row 1: the numbers -->
  <rect x="60" y="368" width="290" height="54" rx="4" fill="#3a7d44" opacity="0.10"/>
  <rect x="60" y="368" width="6" height="54" fill="#3a7d44"/>
  <text class="h" x="76" y="390">The arithmetic and code clauses</text>
  <text class="mi" x="76" y="408">beam calcs, capacity checks, load tables</text>
  <text class="l" x="370" y="399">nobody; it is textbook</text>
  <text class="l" x="575" y="393">almost nothing it did not</text>
  <text class="l" x="575" y="408">already have</text>

  <!-- value arrow on far left -->
  <line x1="46" y1="416" x2="46" y2="128" stroke="#C49A2E" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="m" x="34" y="272" transform="rotate(-90 34 272)" text-anchor="middle" style="fill:#C49A2E;font-weight:bold">value to a buyer</text>

  <!-- your share -->
  <line x1="40" y1="436" x2="760" y2="436" stroke="#e3e6e9" stroke-width="1"/>
  <text class="h" x="60" y="458">Your personal share of the five layers, as an employee:  <tspan style="fill:#b03a2e">close to nothing.</tspan></text>
  <text class="m" x="60" y="476">The offer is addressed to you. What it asks for belongs to the firm and the client. The part worth buying sets your rate.</text>

  <rect x="40" y="490" width="720" height="20" rx="4" fill="#1f2a33"/>
  <text class="m" x="400" y="504" text-anchor="middle" style="fill:#C49A2E">Paid once, for something that reduces the scarcity of what you sell every day after.</text>
</svg>
