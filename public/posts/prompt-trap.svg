<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="A structural metaphor comparing two engineers. Both have a slab of prompt fluency. On the left, the prompt engineer's slab sits over an empty void with no foundation, so it tilts, cracks and settles when loaded by a problem that does not fit the pattern. On the right, the engineer who drives the tools has the same slab bearing on solid layered foundation strata of engineering judgement: framing the problem, sensing a wrong answer, catching the confident mistake, and owning the result." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="rock" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3d4b56" stroke-width="1.2"/>
    </pattern>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="0">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#b03a2e"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="472" rx="10" fill="#ffffff" stroke="#e4ddcb" stroke-width="1.5"/>
  <rect x="4" y="4" width="792" height="5" rx="2.5" fill="#C49A2E"/>

  <!-- title -->
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1f2a33">Prompting Sits On Top of Judgement</text>
  <text x="40" y="60" font-size="13" fill="#6b7680" font-style="italic">The same slab. What it bears on is the whole difference.</text>

  <!-- column headers -->
  <text x="210" y="84" font-size="13.5" font-weight="bold" fill="#9a917f" text-anchor="middle" letter-spacing="0.5">THE "PROMPT ENGINEER"</text>
  <text x="590" y="84" font-size="13.5" font-weight="bold" fill="#1f2a33" text-anchor="middle" letter-spacing="0.5">THE ENGINEER WHO DRIVES THE TOOLS</text>

  <!-- ground line across both -->
  <line x1="60" y1="170" x2="360" y2="170" stroke="#8a7f63" stroke-width="1.6"/>
  <line x1="440" y1="170" x2="740" y2="170" stroke="#8a7f63" stroke-width="1.6"/>

  <!-- ============ LEFT : slab over a void, settling and cracking ============ -->
  <!-- the applied "problem" load on the slab -->
  <g stroke="#b03a2e" stroke-width="2" marker-end="url(#dn)">
    <line x1="150" y1="112" x2="150" y2="132"/>
    <line x1="210" y1="112" x2="210" y2="132"/>
    <line x1="270" y1="112" x2="270" y2="132"/>
  </g>
  <text x="210" y="106" font-size="10.5" fill="#b03a2e" text-anchor="middle" font-style="italic">a problem that doesn't fit the pattern</text>

  <!-- tilted, settling slab (rotated slightly) -->
  <g transform="rotate(4 210 152)">
    <rect x="90" y="138" width="240" height="30" rx="3" fill="#fbf6e9" stroke="#C49A2E" stroke-width="1.8"/>
    <text x="210" y="158" font-size="12" font-weight="bold" fill="#7a5f14" text-anchor="middle">Prompt fluency</text>
  </g>
  <!-- prominent crack through the slab -->
  <path d="M236 140 l-10 9 l12 7 l-11 9 l8 8" fill="none" stroke="#b03a2e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the void beneath -->
  <rect x="90" y="176" width="240" height="120" rx="3" fill="#faf8f3" stroke="#c9c1b0" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="210" y="228" font-size="15" fill="#b9b1a0" text-anchor="middle" font-style="italic">void</text>
  <text x="210" y="248" font-size="10.5" fill="#b9b1a0" text-anchor="middle" font-style="italic">no judgement underneath</text>
  <text x="210" y="262" font-size="10.5" fill="#b9b1a0" text-anchor="middle" font-style="italic">nothing for the slab to bear on</text>

  <!-- settlement arrow beside -->
  <line x1="350" y1="180" x2="350" y2="240" stroke="#b03a2e" stroke-width="1.8" marker-end="url(#dn)"/>
  <text x="358" y="214" font-size="10" fill="#b03a2e" font-style="italic">settles</text>

  <!-- left verdict -->
  <text x="210" y="326" font-size="11" font-weight="bold" fill="#b03a2e" text-anchor="middle">Fast and visible, until it's loaded.</text>
  <text x="210" y="342" font-size="11" font-weight="bold" fill="#b03a2e" text-anchor="middle">Then it cracks and settles.</text>

  <!-- ============ divider ============ -->
  <line x1="400" y1="100" x2="400" y2="360" stroke="#e4ddcb" stroke-width="1.4"/>

  <!-- ============ RIGHT : slab bearing on solid strata ============ -->
  <!-- same load, now carried -->
  <g stroke="#3a7d44" stroke-width="2" marker-end="url(#dn)">
    <line x1="530" y1="112" x2="530" y2="132"/>
    <line x1="590" y1="112" x2="590" y2="132"/>
    <line x1="650" y1="112" x2="650" y2="132"/>
  </g>
  <text x="590" y="106" font-size="10.5" fill="#3a7d44" text-anchor="middle" font-style="italic">the same problem, carried cleanly</text>

  <!-- level slab -->
  <rect x="470" y="138" width="240" height="30" rx="3" fill="#fbf6e9" stroke="#C49A2E" stroke-width="1.8"/>
  <text x="590" y="158" font-size="12" font-weight="bold" fill="#7a5f14" text-anchor="middle">Prompt fluency</text>

  <!-- solid foundation strata (4 layers = 4 judgement capabilities) -->
  <g stroke="#1f2a33" stroke-width="1.2">
    <rect x="470" y="176" width="240" height="30" fill="#2a3540"/>
    <rect x="470" y="206" width="240" height="30" fill="#1f2a33"/>
    <rect x="470" y="236" width="240" height="30" fill="#2a3540"/>
    <rect x="470" y="266" width="240" height="30" fill="#1f2a33"/>
  </g>
  <!-- subtle rock hatch on the strata edges -->
  <rect x="470" y="176" width="240" height="120" fill="url(#rock)" opacity="0.18"/>
  <g font-size="11" fill="#e8ecef">
    <text x="590" y="196" text-anchor="middle">frames the problem correctly</text>
    <text x="590" y="226" text-anchor="middle">senses the wrong answer</text>
    <text x="590" y="256" text-anchor="middle">catches the confident mistake</text>
    <text x="590" y="286" text-anchor="middle">owns the result</text>
  </g>
  <!-- foundation label -->
  <rect x="470" y="298" width="240" height="18" fill="#C49A2E"/>
  <text x="590" y="311" font-size="10.5" fill="#1f2a33" font-weight="bold" text-anchor="middle" letter-spacing="0.8">ENGINEERING JUDGEMENT</text>

  <!-- right verdict -->
  <text x="590" y="334" font-size="11" font-weight="bold" fill="#3a7d44" text-anchor="middle">Built the slow way, over years.</text>
  <text x="590" y="350" font-size="11" font-weight="bold" fill="#3a7d44" text-anchor="middle">Holds when the problem is new.</text>

  <!-- bottom takeaway -->
  <rect x="40" y="378" width="720" height="70" rx="7" fill="#1f2a33"/>
  <text x="400" y="404" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Reward the judgement, not the interface fluency.</text>
  <text x="400" y="424" font-size="11.5" fill="#C49A2E" text-anchor="middle">The prompt is just the interface. The value is the engineer behind it.</text>
  <text x="400" y="440" font-size="10.5" fill="#cdd3d8" text-anchor="middle" font-style="italic">Speed was never the scarce thing. Judgement is, and it can't be prompted into existence.</text>
</svg>
