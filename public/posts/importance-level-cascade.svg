<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="How Importance Level cascades into the whole load regime. The consequence of failure sets the Importance Level, from IL1 to IL4. That sets the annual probability of exceedance, separately for wind and earthquake. For wind, the annual probability sets the regional wind speed VR, which sets the wind pressures. For seismic, it sets the probability factor kp, and kp times the hazard factor Z sets the base shear. Both branches feed member sizes, drift, foundations and detailing. A higher Importance Level means a rarer design event and a larger load." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1f2a33"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="552" rx="10" fill="#ffffff" stroke="#e4ddcb" stroke-width="1.5"/>
  <rect x="4" y="4" width="792" height="5" rx="2.5" fill="#C49A2E"/>

  <!-- title -->
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1f2a33">One Decision Sets the Whole Load Regime</text>
  <text x="40" y="60" font-size="13" fill="#6b7680" font-style="italic">Importance Level cascades into every wind and seismic load on the structure.</text>

  <!-- STEP 1: consequence of failure -->
  <rect x="270" y="82" width="260" height="46" rx="8" fill="#f3f1ea" stroke="#1f2a33" stroke-width="1.5"/>
  <text x="400" y="103" font-size="13.5" font-weight="bold" fill="#1f2a33" text-anchor="middle">Consequence of failure</text>
  <text x="400" y="120" font-size="10" fill="#6b7680" text-anchor="middle">hazard to life · occupancy · post-disaster function</text>
  <line x1="400" y1="128" x2="400" y2="146" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <!-- STEP 2: Importance Level (the hero box) -->
  <rect x="250" y="150" width="300" height="58" rx="8" fill="#1f2a33"/>
  <text x="400" y="172" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Importance Level  ·  IL1 to IL4</text>
  <text x="400" y="190" font-size="9.5" fill="#C49A2E" text-anchor="middle">set once, near the start</text>
  <text x="400" y="202" font-size="9.5" fill="#C49A2E" text-anchor="middle">an engineering judgement, not a form field</text>
  <line x1="400" y1="208" x2="400" y2="226" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <!-- STEP 3: annual probability of exceedance -->
  <rect x="250" y="230" width="300" height="46" rx="8" fill="#fbf6e9" stroke="#C49A2E" stroke-width="1.8"/>
  <text x="400" y="251" font-size="13" font-weight="bold" fill="#7a5f14" text-anchor="middle">Annual probability of exceedance</text>
  <text x="400" y="268" font-size="10" fill="#a07e1f" text-anchor="middle">higher IL → rarer design event → larger load</text>

  <!-- split to two branches -->
  <line x1="400" y1="276" x2="400" y2="292" stroke="#1f2a33" stroke-width="2"/>
  <line x1="205" y1="292" x2="595" y2="292" stroke="#1f2a33" stroke-width="2"/>
  <line x1="205" y1="292" x2="205" y2="312" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="595" y1="292" x2="595" y2="312" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <!-- ===== WIND branch (left) ===== -->
  <rect x="70" y="316" width="270" height="40" rx="7" fill="#eef2f4" stroke="#3a4750" stroke-width="1.4"/>
  <text x="205" y="335" font-size="12.5" font-weight="bold" fill="#1f2a33" text-anchor="middle">WIND</text>
  <text x="205" y="350" font-size="10" fill="#3a4750" text-anchor="middle">AS/NZS 1170.2</text>
  <line x1="205" y1="356" x2="205" y2="372" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="70" y="376" width="270" height="38" rx="7" fill="#f7f9fa" stroke="#c3ccd2" stroke-width="1.2"/>
  <text x="205" y="400" font-size="11.5" fill="#1f2a33" text-anchor="middle">Regional wind speed VR</text>
  <line x1="205" y1="414" x2="205" y2="430" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="70" y="434" width="270" height="38" rx="7" fill="#f7f9fa" stroke="#c3ccd2" stroke-width="1.2"/>
  <text x="205" y="458" font-size="11.5" fill="#1f2a33" text-anchor="middle">Wind pressures on every surface</text>

  <!-- ===== SEISMIC branch (right) ===== -->
  <rect x="460" y="316" width="270" height="40" rx="7" fill="#eef2f4" stroke="#3a4750" stroke-width="1.4"/>
  <text x="595" y="335" font-size="12.5" font-weight="bold" fill="#1f2a33" text-anchor="middle">SEISMIC</text>
  <text x="595" y="350" font-size="10" fill="#3a4750" text-anchor="middle">AS 1170.4</text>
  <line x1="595" y1="356" x2="595" y2="372" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="460" y="376" width="270" height="38" rx="7" fill="#f7f9fa" stroke="#c3ccd2" stroke-width="1.2"/>
  <text x="595" y="400" font-size="11.5" fill="#1f2a33" text-anchor="middle">Probability factor kp</text>
  <line x1="595" y1="414" x2="595" y2="430" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="460" y="434" width="270" height="38" rx="7" fill="#f7f9fa" stroke="#c3ccd2" stroke-width="1.2"/>
  <text x="595" y="458" font-size="11.5" fill="#1f2a33" text-anchor="middle">kp × Z drives the base shear</text>

  <!-- ===== both feed the design ===== -->
  <line x1="205" y1="472" x2="205" y2="500" stroke="#1f2a33" stroke-width="2"/>
  <line x1="595" y1="472" x2="595" y2="500" stroke="#1f2a33" stroke-width="2"/>
  <line x1="205" y1="500" x2="595" y2="500" stroke="#1f2a33" stroke-width="2"/>
  <line x1="400" y1="500" x2="400" y2="510" stroke="#1f2a33" stroke-width="2" marker-end="url(#fa)"/>

  <rect x="230" y="514" width="340" height="34" rx="7" fill="#1f2a33"/>
  <text x="400" y="536" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Member sizes · drift · foundations · detailing</text>
</svg>
