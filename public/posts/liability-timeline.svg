<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="A timeline of an engineer's liability over a structure's life. Design and construction come first, then handover at practical completion, which feels like the end but is not. Liability continues along a long tail: a latent defect can surface years later, and a claim can be brought when the damage is discovered. Shorter limitation periods apply within the window, and a long-stop of broadly ten years from completion sets the outer bar beyond which claims are generally barred." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fa" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1f2a33"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="452" rx="10" fill="#ffffff" stroke="#e4ddcb" stroke-width="1.5"/>
  <rect x="4" y="4" width="792" height="5" rx="2.5" fill="#C49A2E"/>

  <!-- title -->
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1f2a33">Liability Runs Long After Handover</text>
  <text x="40" y="60" font-size="13" fill="#6b7680" font-style="italic">The project closes at completion. Your responsibility for the structure does not.</text>

  <!-- ===== main timeline axis ===== -->
  <line x1="70" y1="150" x2="720" y2="150" stroke="#1f2a33" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="726" y="154" font-size="11" fill="#3a4750" font-style="italic">time</text>

  <!-- phase: design + construction (before handover) -->
  <rect x="70" y="132" width="150" height="36" rx="5" fill="#eef2f4" stroke="#3a4750" stroke-width="1.2"/>
  <text x="145" y="155" font-size="11.5" fill="#1f2a33" text-anchor="middle">Design + construction</text>

  <!-- handover marker -->
  <line x1="240" y1="110" x2="240" y2="180" stroke="#C49A2E" stroke-width="2.5"/>
  <circle cx="240" cy="150" r="6" fill="#C49A2E"/>
  <text x="240" y="102" font-size="12.5" font-weight="bold" fill="#7a5f14" text-anchor="middle">HANDOVER</text>
  <text x="240" y="196" font-size="10" fill="#a07e1f" text-anchor="middle" font-style="italic">feels like the end</text>
  <text x="240" y="208" font-size="10" fill="#a07e1f" text-anchor="middle" font-style="italic">it is not</text>

  <!-- the long tail label -->
  <text x="470" y="132" font-size="12" font-weight="bold" fill="#1f2a33" text-anchor="middle">THE LONG TAIL OF LIABILITY</text>

  <!-- latent defect surfaces, later -->
  <line x1="500" y1="150" x2="500" y2="230" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="500" cy="150" r="5" fill="#b03a2e"/>
  <text x="500" y="248" font-size="11.5" font-weight="bold" fill="#b03a2e" text-anchor="middle">Latent defect surfaces</text>
  <text x="500" y="264" font-size="10" fill="#6b7680" text-anchor="middle">a crack, a moving facade, years later</text>
  <text x="500" y="280" font-size="10" fill="#6b7680" text-anchor="middle">a claim can accrue when damage is discovered</text>

  <!-- long-stop bar -->
  <line x1="680" y1="110" x2="680" y2="180" stroke="#1f2a33" stroke-width="2.5"/>
  <text x="680" y="102" font-size="11.5" font-weight="bold" fill="#1f2a33" text-anchor="middle">LONG-STOP</text>
  <text x="680" y="196" font-size="10" fill="#3a4750" text-anchor="middle" font-style="italic">~10 yrs from completion</text>
  <text x="680" y="208" font-size="10" fill="#6b7680" text-anchor="middle" font-style="italic">outer bar on claims</text>

  <!-- ===== liability span bracket (handover to long-stop) ===== -->
  <line x1="240" y1="330" x2="680" y2="330" stroke="#C49A2E" stroke-width="2"/>
  <line x1="240" y1="322" x2="240" y2="338" stroke="#C49A2E" stroke-width="2"/>
  <line x1="680" y1="322" x2="680" y2="338" stroke="#C49A2E" stroke-width="2"/>
  <rect x="360" y="316" width="200" height="28" rx="6" fill="#fbf6e9" stroke="#C49A2E" stroke-width="1.4"/>
  <text x="460" y="335" font-size="11.5" font-weight="bold" fill="#7a5f14" text-anchor="middle">Exposure window</text>

  <!-- note: shorter limitation periods within -->
  <text x="460" y="366" font-size="10.5" fill="#6b7680" text-anchor="middle" font-style="italic">Within this window, shorter limitation periods apply and vary by state.</text>
  <text x="460" y="381" font-size="10.5" fill="#6b7680" text-anchor="middle" font-style="italic">Duty is real but bounded: not unlimited, and not owed automatically to everyone.</text>

  <!-- bottom takeaway -->
  <rect x="40" y="404" width="720" height="36" rx="7" fill="#1f2a33"/>
  <text x="400" y="420" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Document your reasoning as if someone will read it in a decade. Sign only what you have checked.</text>
  <text x="400" y="434" font-size="10.5" fill="#C49A2E" text-anchor="middle">The building outlives the project. So, for a good while, does your responsibility for it.</text>
</svg>
