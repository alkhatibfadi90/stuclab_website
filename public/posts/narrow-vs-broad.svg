<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="A structural metaphor for career breadth versus depth. Both engineers share the same wide foundation of fundamentals. The generalist builds many short columns spread across the foundation, all of which sit below a horizontal line marking where automation now reaches. The specialist keeps the same wide foundation but builds one tall column in one place, rising well above the automation line, where the judgement and the value live." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="fnd" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#c9d0d6" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="472" rx="10" fill="#ffffff" stroke="#e4ddcb" stroke-width="1.5"/>
  <rect x="4" y="4" width="792" height="5" rx="2.5" fill="#C49A2E"/>

  <!-- title -->
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1f2a33">Same Foundation. Build Height in One Place.</text>
  <text x="40" y="60" font-size="13" fill="#6b7680" font-style="italic">Breadth spreads the effort thin. Depth rises above where the tools reach.</text>

  <!-- column headers -->
  <text x="210" y="92" font-size="13.5" font-weight="bold" fill="#9a917f" text-anchor="middle" letter-spacing="0.5">THE GENERALIST</text>
  <text x="590" y="92" font-size="13.5" font-weight="bold" fill="#1f2a33" text-anchor="middle" letter-spacing="0.5">THE SPECIALIST</text>

  <!-- ===== automation reach line (spans both) ===== -->
  <line x1="60" y1="238" x2="740" y2="238" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="8 5"/>
  <rect x="318" y="226" width="164" height="22" rx="4" fill="#ffffff" stroke="#b03a2e" stroke-width="1"/>
  <text x="400" y="241" font-size="10.5" fill="#b03a2e" text-anchor="middle" font-weight="bold">where automation now reaches</text>

  <!-- ===== LEFT : generalist, many short columns ===== -->
  <!-- wide foundation -->
  <rect x="70" y="330" width="280" height="34" fill="url(#fnd)" stroke="#1f2a33" stroke-width="1.6"/>
  <text x="210" y="352" font-size="10.5" fill="#3a4750" text-anchor="middle">fundamentals (wide)</text>
  <!-- short columns, all below the automation line -->
  <g fill="#e7e3d8" stroke="#1f2a33" stroke-width="1.4">
    <rect x="84"  y="286" width="22" height="44"/>
    <rect x="120" y="292" width="22" height="38"/>
    <rect x="156" y="280" width="22" height="50"/>
    <rect x="192" y="296" width="22" height="34"/>
    <rect x="228" y="284" width="22" height="46"/>
    <rect x="264" y="290" width="22" height="40"/>
    <rect x="300" y="282" width="22" height="48"/>
  </g>
  <!-- label above the short columns -->
  <text x="210" y="272" font-size="10.5" fill="#9a917f" text-anchor="middle" font-style="italic">many short columns, no height anywhere</text>
  <!-- verdict -->
  <text x="210" y="392" font-size="11" font-weight="bold" fill="#b03a2e" text-anchor="middle">Everything sits in the automation zone.</text>
  <text x="210" y="408" font-size="10.5" fill="#6b7680" text-anchor="middle" font-style="italic">adequate at most things, differentiated at none</text>

  <!-- ===== divider ===== -->
  <line x1="400" y1="100" x2="400" y2="416" stroke="#e4ddcb" stroke-width="1.4"/>

  <!-- ===== RIGHT : specialist, one tall column ===== -->
  <!-- same wide foundation -->
  <rect x="450" y="330" width="280" height="34" fill="url(#fnd)" stroke="#1f2a33" stroke-width="1.6"/>
  <text x="590" y="352" font-size="10.5" fill="#3a4750" text-anchor="middle">fundamentals (still wide)</text>
  <!-- a few low columns for context (kept) -->
  <g fill="#e7e3d8" stroke="#1f2a33" stroke-width="1.4">
    <rect x="470" y="296" width="20" height="34"/>
    <rect x="506" y="300" width="20" height="30"/>
    <rect x="654" y="298" width="20" height="32"/>
    <rect x="690" y="302" width="20" height="28"/>
  </g>
  <!-- the one tall column, rising above the automation line -->
  <rect x="566" y="118" width="48" height="212" fill="#1f2a33" stroke="#1f2a33" stroke-width="1.4"/>
  <text x="590" y="224" font-size="9.5" fill="#ffffff" text-anchor="middle" transform="rotate(-90 590 224)" font-weight="bold" letter-spacing="0.6">ONE DEEP SPECIALISM</text>
  <!-- gold cap on top marking the value zone -->
  <rect x="566" y="112" width="48" height="8" fill="#C49A2E"/>
  <!-- callout for the zone above the line -->
  <line x1="566" y1="160" x2="540" y2="160" stroke="#9aa3ab" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="536" y="156" font-size="10.5" font-weight="bold" fill="#1f2a33" text-anchor="end">above the line:</text>
  <text x="536" y="170" font-size="10" fill="#6b7680" text-anchor="end">judgement at the edges,</text>
  <text x="536" y="183" font-size="10" fill="#6b7680" text-anchor="end">where the value went</text>
  <!-- verdict -->
  <text x="590" y="392" font-size="11" font-weight="bold" fill="#3a7d44" text-anchor="middle">Rises above where the tools reach.</text>
  <text x="590" y="408" font-size="10.5" fill="#6b7680" text-anchor="middle" font-style="italic">the specific answer to a specific problem</text>

  <!-- bottom takeaway -->
  <rect x="40" y="428" width="720" height="34" rx="7" fill="#1f2a33"/>
  <text x="400" y="450" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Keep the foundation wide. Build the tall column on one part of it.</text>
</svg>
