<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1f2a33; }
    .t { font-size: 20px; font-weight: bold; }
    .s { font-size: 13px; font-style: italic; fill: #6b7680; }
    .h { font-size: 13px; font-weight: bold; }
    .l { font-size: 12px; }
    .m { font-size: 11px; fill: #6b7680; }
    .mi { font-size: 11px; fill: #6b7680; font-style: italic; }
    .w { font-size: 11px; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2a33"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="540" rx="10" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="6" rx="3" fill="#C49A2E"/>

  <text class="t" x="40" y="40">What a Half Fee Actually Buys</text>
  <text class="s" x="40" y="60">The deliverable is the same on issue day. What goes missing is the part the client never sees.</text>

  <!-- ===== A: two stacked bars ===== -->
  <text class="h" x="40" y="96">A. Where the hours go</text>
  <text class="mi" x="40" y="112">illustrative split of engineering hours on the same building, not survey data</text>

  <!-- bar geometry: full bar x=70..130 ; half bar x=250..310 ; baseline y=400 ; full height 260 -->
  <!-- full fee bar: segments bottom-up: drawings 70, modelling 60, checking 70, senior 60 -->
  <g>
    <rect x="110" y="330" width="60" height="70" fill="#6b7680"/>
    <rect x="110" y="270" width="60" height="60" fill="#3a7d44"/>
    <rect x="110" y="200" width="60" height="70" fill="#C49A2E"/>
    <rect x="110" y="140" width="60" height="60" fill="#b03a2e"/>
  </g>
  <text class="h" x="140" y="420" text-anchor="middle">sustainable fee</text>

  <!-- half fee bar: drawings 70 (same), modelling 45, checking 10, senior 5 : total 130 -->
  <g>
    <rect x="290" y="330" width="60" height="70" fill="#6b7680"/>
    <rect x="290" y="285" width="60" height="45" fill="#3a7d44"/>
    <rect x="290" y="275" width="60" height="10" fill="#C49A2E"/>
    <rect x="290" y="270" width="60" height="5" fill="#b03a2e"/>
  </g>
  <text class="h" x="320" y="420" text-anchor="middle">fee cut by half</text>

  <!-- segment labels between bars -->
  <g>
    <text class="l" x="230" y="368" text-anchor="middle">drawings and</text>
    <text class="l" x="230" y="382" text-anchor="middle">documentation</text>
    <text class="mi" x="230" y="395" text-anchor="middle">visible: unchanged</text>

    <text class="l" x="230" y="300" text-anchor="middle">analysis and</text>
    <text class="l" x="230" y="314" text-anchor="middle">modelling</text>
    <text class="mi" x="230" y="327" text-anchor="middle">trimmed, more junior</text>
  </g>
  <!-- checking / senior labels on the left of full bar -->
  <text class="l" x="102" y="238" text-anchor="end">independent</text>
  <text class="l" x="102" y="252" text-anchor="end">checking</text>
  <text class="l" x="102" y="168" text-anchor="end">senior</text>
  <text class="l" x="102" y="182" text-anchor="end">review</text>

  <!-- arrows from full segments to collapsed segments -->
  <line x1="170" y1="235" x2="288" y2="280" stroke="#C49A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="170" y1="170" x2="288" y2="272" stroke="#b03a2e" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- bracket showing what vanished -->
  <line x1="362" y1="140" x2="362" y2="270" stroke="#b03a2e" stroke-width="1.4"/>
  <line x1="358" y1="140" x2="366" y2="140" stroke="#b03a2e" stroke-width="1.4"/>
  <line x1="358" y1="270" x2="366" y2="270" stroke="#b03a2e" stroke-width="1.4"/>
  <text class="h" x="372" y="200" style="fill:#b03a2e">gone</text>
  <text class="mi" x="372" y="215">invisible</text>
  <text class="mi" x="372" y="228">on issue day</text>

  <!-- ===== B: timeline ===== -->
  <text class="h" x="430" y="96">B. When the difference shows up</text>
  <line x1="480" y1="250" x2="750" y2="250" stroke="#1f2a33" stroke-width="1.4" marker-end="url(#ah)"/>
  <g stroke="#1f2a33" stroke-width="1.2">
    <line x1="490" y1="244" x2="490" y2="256"/>
    <line x1="560" y1="244" x2="560" y2="256"/>
    <line x1="690" y1="244" x2="690" y2="256"/>
  </g>
  <text class="l" x="490" y="275" text-anchor="middle">issue</text>
  <text class="l" x="560" y="275" text-anchor="middle">handover</text>
  <text class="l" x="690" y="275" text-anchor="middle">year 3</text>

  <text class="m" x="490" y="225" text-anchor="middle">both sets</text>
  <text class="m" x="490" y="237" text-anchor="middle">look identical</text>
  <text class="m" x="575" y="296" text-anchor="middle">developer has moved on</text>
  <circle cx="690" cy="250" r="6" fill="#b03a2e"/>
  <text class="h" x="690" y="218" text-anchor="middle" style="fill:#b03a2e">cracking, evacuation,</text>
  <text class="h" x="690" y="232" text-anchor="middle" style="fill:#b03a2e">inquiry</text>

  <!-- what the inquiry checks -->
  <rect x="430" y="308" width="330" height="110" rx="6" fill="#f4f1ea"/>
  <text class="h" x="446" y="330">What the inquiry asks</text>
  <text class="l" x="446" y="353">1. Was the engineer qualified and registered?</text>
  <text class="mi" x="466" y="368">registration answers this: yes</text>
  <text class="l" x="446" y="391">2. How many hours of checking were done?</text>
  <text class="mi" x="466" y="407" style="fill:#b03a2e">registration is silent: the fee answers this</text>

  <!-- footer -->
  <rect x="40" y="446" width="720" height="70" rx="6" fill="#1f2a33"/>
  <text class="h" x="400" y="470" text-anchor="middle" style="fill:#ffffff">Registration certifies the person. The fee funds the hours. Defects come from the hours.</text>
  <text class="l" x="400" y="492" text-anchor="middle" style="fill:#C49A2E">A fee that cannot pay for the review is not a competitive price. It is a liability carried for free.</text>
  <text class="m" x="400" y="508" text-anchor="middle" style="fill:#aab3bb">Opal Tower, Mascot Towers, Neo200: each followed by a registration push, none by a fee floor.</text>
</svg>
