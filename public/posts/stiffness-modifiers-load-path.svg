<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="An engineering figure showing how stiffness modifiers change where lateral load goes. Two identical frames, each with a core wall and two perimeter columns under the same storey shear. On the left, every element is given the same 0.35 modifier: the columns are modelled far softer than they really are, so the model sends most of the shear to the core. On the right, the correct ratios are used, columns at 0.70 and the cracked wall at 0.35, and the shear rebalances toward the columns. Force follows stiffness, so a uniform value moves the load. Below, a mapping strip lists each element type with its modifier and the exact ETABS property it belongs on: I22 and I33 for beams and columns, f22 for wall piers, f11 for spandrels, f12 for wall shear, and m11, m22, m12 for slabs." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1f2a33"/>
    </marker>
    <marker id="fg" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#C49A2E"/>
    </marker>
    <pattern id="conc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#c9d0d6" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="652" rx="10" fill="#ffffff" stroke="#e4ddcb" stroke-width="1.5"/>
  <rect x="4" y="4" width="792" height="5" rx="2.5" fill="#C49A2E"/>

  <!-- title -->
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1f2a33">Force Follows Stiffness. A Uniform Modifier Moves the Load.</text>
  <text x="40" y="60" font-size="13" fill="#6b7680" font-style="italic">Same frame, same storey shear. Only the modifiers differ.</text>

  <!-- ================= LEFT: uniform 0.35 ================= -->
  <text x="210" y="92" font-size="12.5" font-weight="bold" fill="#8a2a20" text-anchor="middle">UNIFORM: everything at 0.35</text>
  <text x="210" y="108" font-size="10" fill="#b03a2e" text-anchor="middle" font-style="italic">columns modelled as cracked as a beam</text>

  <!-- storey shear in -->
  <line x1="40" y1="200" x2="88" y2="200" stroke="#C49A2E" stroke-width="3" marker-end="url(#fg)"/>
  <text x="58" y="186" font-size="11" font-weight="bold" fill="#a07e1f" text-anchor="middle">V</text>
  <text x="58" y="222" font-size="8.5" fill="#a07e1f" text-anchor="middle" font-style="italic">storey shear</text>

  <!-- ground -->
  <line x1="96" y1="330" x2="336" y2="330" stroke="#8a7f63" stroke-width="1.8"/>

  <!-- frame: left col, core, right col; a slab on top -->
  <rect x="96" y="118" width="240" height="8" fill="#d8d2c4" stroke="#1f2a33" stroke-width="1.2"/>
  <!-- left column (soft, drawn thin/faded) -->
  <rect x="106" y="126" width="12" height="204" fill="#f3f1ea" stroke="#9aa3ab" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="112" y="345" font-size="8.5" fill="#6b7680" text-anchor="middle">col 0.35</text>
  <!-- core (cracked, same 0.35 but genuinely stiff by size) -->
  <rect x="190" y="126" width="52" height="204" fill="url(#conc)" stroke="#1f2a33" stroke-width="1.6"/>
  <text x="216" y="345" font-size="8.5" fill="#1f2a33" text-anchor="middle">core 0.35</text>
  <!-- right column -->
  <rect x="314" y="126" width="12" height="204" fill="#f3f1ea" stroke="#9aa3ab" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="320" y="345" font-size="8.5" fill="#6b7680" text-anchor="middle">col 0.35</text>

  <!-- force share arrows (down into elements) : skewed to core -->
  <line x1="112" y1="145" x2="112" y2="170" stroke="#6b7680" stroke-width="2" marker-end="url(#fa)"/>
  <text x="112" y="182" font-size="9" fill="#6b7680" text-anchor="middle">6%</text>
  <line x1="216" y1="145" x2="216" y2="185" stroke="#b03a2e" stroke-width="4" marker-end="url(#fa)"/>
  <text x="216" y="200" font-size="10.5" font-weight="bold" fill="#b03a2e" text-anchor="middle">88%</text>
  <line x1="320" y1="145" x2="320" y2="170" stroke="#6b7680" stroke-width="2" marker-end="url(#fa)"/>
  <text x="320" y="182" font-size="9" fill="#6b7680" text-anchor="middle">6%</text>

  <!-- share bar under frame -->
  <rect x="96" y="360" width="240" height="14" fill="#f3f1ea" stroke="#d8d2c4" stroke-width="1"/>
  <rect x="96" y="360" width="14" height="14" fill="#9aa3ab"/>
  <rect x="110" y="360" width="212" height="14" fill="#b03a2e"/>
  <rect x="322" y="360" width="14" height="14" fill="#9aa3ab"/>
  <text x="216" y="388" font-size="9.5" fill="#b03a2e" text-anchor="middle" font-style="italic">core over-loaded, columns starved</text>

  <!-- ================= divider ================= -->
  <line x1="400" y1="84" x2="400" y2="396" stroke="#e4ddcb" stroke-width="1.4"/>

  <!-- ================= RIGHT: correct ratios ================= -->
  <text x="590" y="92" font-size="12.5" font-weight="bold" fill="#2c5f34" text-anchor="middle">CORRECT: columns 0.70, cracked wall 0.35</text>
  <text x="590" y="108" font-size="10" fill="#3a7d44" text-anchor="middle" font-style="italic">compression keeps the columns stiff</text>

  <line x1="420" y1="200" x2="468" y2="200" stroke="#C49A2E" stroke-width="3" marker-end="url(#fg)"/>
  <text x="438" y="186" font-size="11" font-weight="bold" fill="#a07e1f" text-anchor="middle">V</text>
  <text x="438" y="222" font-size="8.5" fill="#a07e1f" text-anchor="middle" font-style="italic">storey shear</text>

  <line x1="476" y1="330" x2="716" y2="330" stroke="#8a7f63" stroke-width="1.8"/>

  <rect x="476" y="118" width="240" height="8" fill="#d8d2c4" stroke="#1f2a33" stroke-width="1.2"/>
  <!-- left column (stiffer, solid) -->
  <rect x="486" y="126" width="12" height="204" fill="#e7e3d8" stroke="#1f2a33" stroke-width="1.6"/>
  <text x="492" y="345" font-size="8.5" fill="#1f2a33" text-anchor="middle">col 0.70</text>
  <!-- core -->
  <rect x="570" y="126" width="52" height="204" fill="url(#conc)" stroke="#1f2a33" stroke-width="1.6"/>
  <text x="596" y="345" font-size="8.5" fill="#1f2a33" text-anchor="middle">core 0.35</text>
  <!-- right column -->
  <rect x="694" y="126" width="12" height="204" fill="#e7e3d8" stroke="#1f2a33" stroke-width="1.6"/>
  <text x="700" y="345" font-size="8.5" fill="#1f2a33" text-anchor="middle">col 0.70</text>

  <!-- force shares: rebalanced -->
  <line x1="492" y1="145" x2="492" y2="178" stroke="#3a7d44" stroke-width="2.6" marker-end="url(#fa)"/>
  <text x="492" y="192" font-size="9.5" font-weight="bold" fill="#3a7d44" text-anchor="middle">18%</text>
  <line x1="596" y1="145" x2="596" y2="182" stroke="#1f2a33" stroke-width="3.2" marker-end="url(#fa)"/>
  <text x="596" y="197" font-size="10" font-weight="bold" fill="#1f2a33" text-anchor="middle">64%</text>
  <line x1="700" y1="145" x2="700" y2="178" stroke="#3a7d44" stroke-width="2.6" marker-end="url(#fa)"/>
  <text x="700" y="192" font-size="9.5" font-weight="bold" fill="#3a7d44" text-anchor="middle">18%</text>

  <rect x="476" y="360" width="240" height="14" fill="#f3f1ea" stroke="#d8d2c4" stroke-width="1"/>
  <rect x="476" y="360" width="43" height="14" fill="#3a7d44"/>
  <rect x="519" y="360" width="154" height="14" fill="#1f2a33"/>
  <rect x="673" y="360" width="43" height="14" fill="#3a7d44"/>
  <text x="596" y="388" font-size="9.5" fill="#2c5f34" text-anchor="middle" font-style="italic">share matches the real stiffness ratio</text>

  <!-- note on the numbers -->
  <text x="400" y="410" font-size="9" fill="#8a94a0" text-anchor="middle" font-style="italic">shares are illustrative: the point is the direction of the shift, not the exact split</text>

  <!-- ================= MAPPING STRIP ================= -->
  <line x1="40" y1="426" x2="760" y2="426" stroke="#e4ddcb" stroke-width="1.4"/>
  <text x="40" y="450" font-size="12" font-weight="bold" fill="#1f2a33">Which modifier, on which ETABS property</text>

  <!-- header row -->
  <rect x="40" y="460" width="720" height="22" fill="#1f2a33"/>
  <g font-size="10" font-weight="bold" fill="#ffffff">
    <text x="52" y="475">Element</text>
    <text x="230" y="475">Cracks in</text>
    <text x="420" y="475">Typical modifier</text>
    <text x="580" y="475">ETABS property it goes on</text>
  </g>
  <!-- rows -->
  <g font-size="10" fill="#1f2a33">
    <rect x="40" y="482" width="720" height="22" fill="#f7f9fa"/>
    <text x="52" y="497">Beam / column (frame)</text><text x="230" y="497">flexure</text><text x="420" y="497">0.35 beam · 0.70 column</text><text x="580" y="497" font-weight="bold">I22, I33</text>
    <rect x="40" y="504" width="720" height="22" fill="#ffffff"/>
    <text x="52" y="519">Wall pier</text><text x="230" y="519">in-plane flexure</text><text x="420" y="519">0.70 uncracked · 0.35 cracked</text><text x="580" y="519" font-weight="bold">f22</text>
    <rect x="40" y="526" width="720" height="22" fill="#f7f9fa"/>
    <text x="52" y="541">Spandrel / coupling beam</text><text x="230" y="541">in-plane flexure (rotated)</text><text x="420" y="541">0.35</text><text x="580" y="541" font-weight="bold">f11</text>
    <rect x="40" y="548" width="720" height="22" fill="#ffffff"/>
    <text x="52" y="563">Wall, shear</text><text x="230" y="563">in-plane shear</text><text x="420" y="563">reduce if shear-cracked</text><text x="580" y="563" font-weight="bold">f12</text>
    <rect x="40" y="570" width="720" height="22" fill="#f7f9fa"/>
    <text x="52" y="585">Flat slab</text><text x="230" y="585">out-of-plane bending</text><text x="420" y="585">0.25</text><text x="580" y="585" font-weight="bold">m11, m22, m12</text>
    <rect x="40" y="592" width="720" height="22" fill="#ffffff"/>
    <text x="52" y="607">Wall, not designed out-of-plane</text><text x="230" y="607">n/a (numerical only)</text><text x="420" y="607">about 0.1</text><text x="580" y="607" font-weight="bold">m11, m22, m12</text>
  </g>

  <!-- takeaway -->
  <rect x="40" y="622" width="720" height="26" rx="6" fill="#fbf6e9" stroke="#C49A2E" stroke-width="1.2"/>
  <text x="400" y="639" font-size="10.5" font-weight="bold" fill="#7a5f14" text-anchor="middle">Preserve the ratios between elements: they are the physics. Then put each one on the right property.</text>
</svg>
