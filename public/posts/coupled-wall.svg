<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="How a coupled-wall system works. Two shear wall piers either side of an opening are linked by a coupling beam at every floor. Under lateral load the coupling beams go into reverse-curvature shear and force the piers to act together, resisting overturning as an axial push-pull couple: one pier goes into tension, the other into compression. An inset contrasts diagonal reinforcement for short shear-critical beams against conventional reinforcement for slender flexural beams, and an aspect-ratio scale shows diagonal below 2, conventional from 2 to 4, and flexural above 4." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1f2a33"/>
    </marker>
    <marker id="arg" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#C49A2E"/>
    </marker>
    <pattern id="conc" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c9d0d6" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="592" rx="10" fill="#ffffff" stroke="#e4ddcb" stroke-width="1.5"/>
  <rect x="4" y="4" width="792" height="5" rx="2.5" fill="#C49A2E"/>

  <!-- title -->
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1f2a33">How a Coupled-Wall System Actually Works</text>
  <text x="40" y="60" font-size="13" fill="#6b7680" font-style="italic">The coupling beams force two piers to resist overturning together, as an axial couple.</text>

  <!-- ===== lateral load arrows (left) ===== -->
  <g stroke="#C49A2E" stroke-width="2.6" marker-end="url(#arg)">
    <line x1="60" y1="110" x2="120" y2="110"/>
    <line x1="60" y1="180" x2="120" y2="180"/>
    <line x1="60" y1="250" x2="120" y2="250"/>
    <line x1="60" y1="320" x2="120" y2="320"/>
    <line x1="60" y1="390" x2="120" y2="390"/>
  </g>
  <text x="52" y="95" font-size="12" fill="#C49A2E" font-weight="bold">wind /</text>
  <text x="52" y="392" font-size="11" fill="#a07e1f" font-style="italic" text-anchor="end" transform="rotate(-90 52 392)">lateral load</text>

  <!-- ===== two piers ===== -->
  <!-- left pier -->
  <rect x="150" y="90" width="70" height="340" fill="url(#conc)" stroke="#1f2a33" stroke-width="1.8"/>
  <!-- right pier -->
  <rect x="280" y="90" width="70" height="340" fill="url(#conc)" stroke="#1f2a33" stroke-width="1.8"/>
  <text x="185" y="450" font-size="11" fill="#3a4750" text-anchor="middle">pier 1</text>
  <text x="315" y="450" font-size="11" fill="#3a4750" text-anchor="middle">pier 2</text>

  <!-- opening label -->
  <text x="250" y="80" font-size="10.5" fill="#6b7680" text-anchor="middle" font-style="italic">opening</text>

  <!-- ===== coupling beams at each floor ===== -->
  <g fill="#e9d9a8" stroke="#a07e1f" stroke-width="1.5">
    <rect x="220" y="112" width="60" height="16"/>
    <rect x="220" y="182" width="60" height="16"/>
    <rect x="220" y="252" width="60" height="16"/>
    <rect x="220" y="322" width="60" height="16"/>
    <rect x="220" y="392" width="60" height="16"/>
  </g>
  <!-- callout to one beam -->
  <line x1="350" y1="260" x2="470" y2="260" stroke="#9aa3ab" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="474" y="257" font-size="11" font-weight="bold" fill="#7a5f14">coupling beam</text>
  <text x="474" y="272" font-size="10" fill="#6b7680">at every floor: high shear,</text>
  <text x="474" y="285" font-size="10" fill="#6b7680">reverse-curvature bending</text>

  <!-- ===== axial couple: tension one pier, compression other ===== -->
  <!-- tension (up) on left pier, inside the diagram band -->
  <line x1="185" y1="150" x2="185" y2="112" stroke="#3a7d44" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="150" y="150" width="70" height="16" fill="#ffffff" opacity="0.85"/>
  <text x="185" y="163" font-size="11" font-weight="bold" fill="#3a7d44" text-anchor="middle">TENSION</text>
  <!-- compression (down) on right pier, inside the diagram band -->
  <line x1="315" y1="372" x2="315" y2="410" stroke="#b03a2e" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="265" y="368" width="100" height="15" fill="#ffffff" opacity="0.85"/>
  <text x="315" y="380" font-size="11" font-weight="bold" fill="#b03a2e" text-anchor="middle">COMPRESSION</text>

  <!-- couple explanation -->
  <text x="474" y="330" font-size="11" font-weight="bold" fill="#1f2a33">The push-pull couple</text>
  <text x="474" y="346" font-size="10.5" fill="#6b7680">One pier is pushed down, the</text>
  <text x="474" y="360" font-size="10.5" fill="#6b7680">other pulled up. This axial</text>
  <text x="474" y="374" font-size="10.5" fill="#6b7680">couple resists much of the</text>
  <text x="474" y="388" font-size="10.5" fill="#6b7680">overturning, far stiffer than</text>
  <text x="474" y="402" font-size="10.5" fill="#6b7680">two piers bending alone.</text>
  <text x="474" y="422" font-size="10.5" fill="#a07e1f" font-style="italic">Coupling ratio ≈ 0.45 to 0.6</text>
  <text x="474" y="436" font-size="10.5" fill="#a07e1f" font-style="italic">in an efficient system.</text>

  <!-- ground -->
  <line x1="120" y1="430" x2="460" y2="430" stroke="#8a7f63" stroke-width="2"/>
  <g stroke="#8a7f63" stroke-width="1">
    <line x1="140" y1="430" x2="130" y2="442"/><line x1="170" y1="430" x2="160" y2="442"/>
    <line x1="200" y1="430" x2="190" y2="442"/><line x1="380" y1="430" x2="370" y2="442"/>
    <line x1="410" y1="430" x2="400" y2="442"/><line x1="440" y1="430" x2="430" y2="442"/>
  </g>

  <!-- ================= REINFORCEMENT INSET ================= -->
  <line x1="40" y1="478" x2="760" y2="478" stroke="#e4ddcb" stroke-width="1"/>
  <text x="40" y="502" font-size="13" font-weight="bold" fill="#1f2a33">Which reinforcement? The aspect ratio (clear span ÷ depth) decides.</text>

  <!-- diagonal beam sketch -->
  <rect x="60" y="516" width="150" height="52" fill="#f7f4ec" stroke="#a07e1f" stroke-width="1.4"/>
  <line x1="66" y1="562" x2="204" y2="522" stroke="#b03a2e" stroke-width="2"/>
  <line x1="66" y1="522" x2="204" y2="562" stroke="#b03a2e" stroke-width="2"/>
  <text x="135" y="586" font-size="10.5" fill="#3a4750" text-anchor="middle" font-weight="bold">Diagonal reinforcement</text>

  <!-- conventional beam sketch -->
  <rect x="250" y="516" width="150" height="52" fill="#f7f4ec" stroke="#3a4750" stroke-width="1.4"/>
  <line x1="258" y1="528" x2="392" y2="528" stroke="#3a4750" stroke-width="1.8"/>
  <line x1="258" y1="556" x2="392" y2="556" stroke="#3a4750" stroke-width="1.8"/>
  <g stroke="#8a94a0" stroke-width="1">
    <rect x="272" y="524" width="14" height="36" fill="none"/>
    <rect x="304" y="524" width="14" height="36" fill="none"/>
    <rect x="336" y="524" width="14" height="36" fill="none"/>
    <rect x="368" y="524" width="10" height="36" fill="none"/>
  </g>
  <text x="325" y="586" font-size="10.5" fill="#3a4750" text-anchor="middle" font-weight="bold">Conventional reinforcement</text>

  <!-- aspect ratio scale -->
  <g>
    <rect x="440" y="524" width="106" height="30" fill="#f3d9d2" stroke="#b03a2e" stroke-width="1.2"/>
    <text x="493" y="543" font-size="10.5" fill="#8a2a20" text-anchor="middle" font-weight="bold">&lt; 2</text>
    <rect x="546" y="524" width="106" height="30" fill="#fbf1d8" stroke="#a07e1f" stroke-width="1.2"/>
    <text x="599" y="543" font-size="10.5" fill="#7a5f14" text-anchor="middle" font-weight="bold">2 to 4</text>
    <rect x="652" y="524" width="96" height="30" fill="#e4ece2" stroke="#3a7d44" stroke-width="1.2"/>
    <text x="700" y="543" font-size="10.5" fill="#2c5f34" text-anchor="middle" font-weight="bold">&gt; 4</text>

    <text x="493" y="568" font-size="9.5" fill="#8a2a20" text-anchor="middle">diagonal</text>
    <text x="599" y="568" font-size="9.5" fill="#7a5f14" text-anchor="middle">conventional</text>
    <text x="700" y="568" font-size="9.5" fill="#2c5f34" text-anchor="middle">flexural</text>
    <text x="594" y="585" font-size="9.5" fill="#6b7680" text-anchor="middle" font-style="italic">shear-critical  ←  aspect ratio  →  flexure-governed</text>
  </g>
</svg>
